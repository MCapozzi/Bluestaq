services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: rootpw
      MYSQL_DATABASE: notes
      MYSQL_USER: notes
      MYSQL_PASSWORD: notespw
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-unotes", "-pnotespw"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    restart: on-failure
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      ConnectionStrings__Notes: "Server=mysql;Port=3306;Database=notes;User=notes;Password=notespw;"
      Database__MigrateOnStartup: "true"
    ports:
      - "8080:8080"

volumes:
  mysql-data:
